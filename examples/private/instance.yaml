# Copy to ~/.config/dsptchr/private/instance.yaml and replace the placeholders.
timezone: Europe/Berlin
channels:
  telegram:
    operator_user_id: 123456789      # your Telegram user ID
    group_id: -1001234567890         # the forum group the bots live in
    bot_token: telegram_bot_token    # name of an entry in secrets.yaml
briefings:
  morning: "07:30"
  evening: "17:30"
heartbeat:
  push_url: heartbeat_push_url       # name of an entry in secrets.yaml
  interval_minutes: 5

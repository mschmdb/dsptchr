# Keychain references only. Never put secret values here.
# Create an item with:
#   security add-generic-password -s dsptchr.private -a telegram-bot -w
telegram_bot_token:
  keychain:
    service: dsptchr.private
    account: telegram-bot
heartbeat_push_url:
  keychain:
    service: dsptchr.private
    account: heartbeat-push-url
anthropic_api_key:
  keychain:
    service: dsptchr.private
    account: anthropic-api-key
